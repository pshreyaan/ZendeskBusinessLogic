service: zendesk-business-logic

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'dev'}
  region: eu-west-1
  memorySize: 128
  timeout: 30
  lambdaHashingVersion: 20201221
  logRetentionInDays: ${self:custom.config.logRetentionInDays}
  stackTags:
    service: zendesk-business-logic
    env: ${env:CONFIG_ENV, 'dev'}
    version: v1.0.0
    committer: ${env:GIT_COMMITTER, 'local'}
  iam:
    deploymentRole: ${self:custom.config.deploymentRoleArn, ''}
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogStream
            - logs:CreateLogGroup
            - logs:TagResource
            - logs:PutLogEvents
          Resource:
            - "arn:aws:logs:${self:provider.region}:*:log-group:/aws/lambda/*"
        - Effect: Allow
          Action:
            - ec2:DescribeSecurityGroups
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DescribeSubnets
            - ec2:DeleteNetworkInterface
            - ec2:AssignPrivateIpAddresses
            - ec2:UnassignPrivateIpAddresses
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource: "arn:aws:s3:::elemica-attachments-${self:provider.stage}-dublin-${self:provider.stage}/*"
        - Effect: Allow
          Action:
            - ssm:GetParametersByPath
            - kms:Decrypt
            - kms:DescribeKey
          Resource: "*"
  environment:
    LOG_LEVEL: ${self:custom.config.logLevel, 'INFO'}
    STAGE: ${self:provider.stage}
    PREFIX: ${self:custom.config.resourcePrefix, 'zendesk-business-logic'}

custom:
  environment: ${env:CONFIG_ENV, 'dev'}
  config: ${file(config/${self:custom.environment}.yml), file(config/dev.yml)}
  prune:
    automatic: true
    number: ${self:custom.config.lambdaVersionsToKeep, 5}

package:
  individually: true
  patterns:
    - '!node_modules/**'

plugins:
  - serverless-prune-plugin

functions:
  businessHoursProcessor:
    name: zendesk-business-logic-businessHoursProcessor-${self:provider.stage}
    handler: src/lambdas/businessHoursProcessor.handler
    description: "Zendesk Business Hours Processing Lambda"
  runtime: nodejs22.x
    memorySize: 128
    timeout: 30
    environment:
      apiToken: ${self:custom.config.zendesk.apiToken}
      subdomain: ${self:custom.config.zendesk.subdomain}
      email: ${self:custom.config.zendesk.email}
    events:
      - schedule:
          rate: cron(1 * * * ? *)
          description: "Run business hours processing at 1 minute past every hour"
    maximumEventAge: 21600
    maximumRetryAttempts: 2

resources:
  Description: "Zendesk Business Logic - Serverless Application"
